<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check20 | Solidity Architect & AI Automation Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;700;900&display=swap');
        
        :root { --cian: #00f0ff; --magenta: #ff00ff; --purple: #d11fff; }
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .hero-font { font-family: 'Space Grotesk', sans-serif; }
        
        .master-bg { background-image: radial-gradient(circle at 50% 10%, #1a0033 0%, #0c0022 40%, #000000 80%); min-height: 100vh; position: relative; }
        
        #particles { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: 1; pointer-events: none; }
        .content-wrapper { position: relative; z-index: 10; }

        .title-glow { text-shadow: 0 0 15px var(--cian), 0 0 30px var(--purple); }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); transition: 0.3s; }
        .glass-panel:hover { border-color: rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.05); }
        
        .cta-button { background: linear-gradient(135deg, #a400e0 0%, #1b89ff 100%); box-shadow: 0 10px 40px rgba(164, 0, 224, 0.4); transition: 0.3s; }
        .cta-button:hover { transform: scale(1.02); }

        /* Brand Colors */
        .color-tg { color: #26A5E4; }
        .color-x { color: #FFFFFF; }
        .color-gh { color: #f0f6fc; }
        .color-yt { color: #FF0000; }
        .color-tk { color: #ff0050; }
    </style>
</head>
<body class="master-bg flex justify-center py-6">
    <canvas id="particles"></canvas>
    
    <div class="w-full max-w-[480px] px-6 content-wrapper">
        <header class="flex justify-center py-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-3xl font-black text-black rotate-45">+57</div>
                <span class="text-3xl font-black tracking-tighter hero-font">Check20</span>
            </div>
        </header>

        <h1 class="text-4xl font-black leading-tight text-center mb-6 uppercase tracking-tighter title-glow hero-font">
            Solidity Architect<br>& AI Automation Engineer
        </h1>
        
        <div class="text-center mb-8">
            <span class="text-2xl font-bold">Founder +57 Ecosystem</span>
            <span class="bg-purple-600/40 border border-purple-500 text-purple-200 text-[10px] font-bold px-3 py-1 rounded-full ml-3">POAP 🟣</span>
        </div>

        <a href="https://t.me/plus57_ecosystem" class="cta-button w-full py-5 rounded-3xl text-white font-black text-xl flex items-center justify-center gap-3 no-underline uppercase italic mb-8">
            Únete Gasless al Ecosistema <i class="fa-solid fa-bolt-lightning text-2xl"></i>
        </a>

        <div class="grid grid-cols-1 gap-3 mb-10">
            <a href="https://t.me/plus57_ecosystem" class="glass-panel flex items-center gap-5 p-5 rounded-2xl no-underline">
                <i class="fa-brands fa-telegram text-4xl color-tg"></i>
                <div class="flex flex-col">
                    <span class="text-lg font-black uppercase">Telegram Node</span>
                    <span class="text-[10px] text-zinc-500 tracking-widest uppercase">Community & Alpha</span>
                </div>
            </a>
            <a href="https://x.com/criptoganacol" class="glass-panel flex items-center gap-5 p-5 rounded-2xl no-underline">
                <i class="fa-brands fa-x-twitter text-4xl color-x"></i>
                <div class="flex flex-col">
                    <span class="text-lg font-black uppercase">X / Twitter</span>
                    <span class="text-[10px] text-zinc-500 tracking-widest uppercase">Tech Updates</span>
                </div>
            </a>
            <a href="https://github.com/Check20" class="glass-panel flex items-center gap-5 p-5 rounded-2xl no-underline">
                <i class="fa-brands fa-github text-4xl color-gh"></i>
                <div class="flex flex-col">
                    <span class="text-lg font-black uppercase">GitHub</span>
                    <span class="text-[10px] text-zinc-500 tracking-widest uppercase">Verified Repos</span>
                </div>
            </a>
            <a href="https://youtube.com/@futbolygoles20" class="glass-panel flex items-center gap-5 p-5 rounded-2xl no-underline">
                <i class="fa-brands fa-youtube text-4xl color-yt"></i>
                <div class="flex flex-col">
                    <span class="text-lg font-black uppercase">YouTube</span>
                    <span class="text-[10px] text-zinc-500 tracking-widest uppercase">3D Bitcoin Studio</span>
                </div>
            </a>
            <a href="https://www.tiktok.com/@salm_520" class="glass-panel flex items-center gap-5 p-5 rounded-2xl no-underline">
                <i class="fa-brands fa-tiktok text-4xl color-tk"></i>
                <div class="flex flex-col">
                    <span class="text-lg font-black uppercase">TikTok 3D</span>
                    <span class="text-[10px] text-zinc-500 tracking-widest uppercase">High Retention Content</span>
                </div>
            </a>
        </div>

        <div class="text-center text-[10px] text-zinc-600 uppercase tracking-[0.4em] font-mono mb-10">
            Polygon Mainnet • Neural Agents • © 2026
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class P {
            constructor() { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.s = Math.random()*2; this.dx = Math.random()*0.5-0.25; this.dy = Math.random()*0.5-0.25; }
            u() { this.x+=this.dx; this.y+=this.dy; if(this.x<0||this.x>canvas.width)this.dx*=-1; if(this.y<0||this.y>canvas.height)this.dy*=-1; }
            d() { ctx.fillStyle='rgba(168,85,247,0.4)'; ctx.beginPath(); ctx.arc(this.x,this.y,this.s,0,Math.PI*2); ctx.fill(); }
        }
        function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{p.u();p.d();}); requestAnimationFrame(animate); }
        window.onload = () => { resize(); for(let i=0;i<80;i++)particles.push(new P()); animate(); };
        window.onresize = resize;
    </script>
</body>
</html>
