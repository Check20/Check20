<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check20 | Solidity Architect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 40px 20px; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; text-align: center; }
        
        /* Foto de Perfil con Neón */
        .profile-pic { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #00e6ff; box-shadow: 0 0 20px #00e6ff, inset 0 0 10px #00e6ff; margin-bottom: 20px; object-fit: cover; }
        
        h1 { font-size: 1.8rem; margin-bottom: 5px; letter-spacing: -1px; }
        .tag { color: #00e6ff; font-size: 0.75rem; letter-spacing: 3px; font-weight: bold; margin-bottom: 30px; display: block; opacity: 0.8; }
        
        /* Bio Estilo Glassmorphism */
        .bio { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 30px; font-size: 0.95rem; line-height: 1.6; color: #ccc; }
        
        /* Botón de TikTok Factory Ready */
        .cta { display: block; background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%); color: #fff; text-decoration: none; padding: 20px; border-radius: 15px; font-weight: 800; font-size: 1.1rem; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0, 210, 255, 0.4); transition: 0.3s; text-transform: uppercase; }
        
        /* Grid de Redes */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: #111; border: 1px solid #222; padding: 18px; border-radius: 15px; text-decoration: none; color: #fff; font-size: 0.85rem; font-weight: 600; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .card:hover { border-color: #00e6ff; background: #161616; transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0, 230, 255, 0.1); }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://github.com/Check20.png" class="profile-pic" onerror="this.src='https://via.placeholder.com/150'">

        <div class="bio">
            Solidity Architect & AI Automation Engineer. <br>

        <a href="https://t.me/tu_usuario" class="cta">🚀 GET FREE PROMPT GUIDE</a>

            <a href="https://x.com/criptoganacol" class="card">X / Twitter</a>
            <a href="https://tiktok.com/@salm_520" class="card">TikTok 3D</a>
            <a href="https://mexc.com" class="card">MEXC Bonus</a>
        </div>
    </div>
</body>
</html>
